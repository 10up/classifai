name: PR Playground Preview

# Use workflow_run for privileged operations
# Runs with write permissions and access to secrets
# Operates on artifacts from the unprivileged build workflow
on:
  workflow_run:
    workflows: [ 'Build Preview Zip' ]
    types:
      - completed

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  # Leaves a comment on a pull request with a link to test the changes in a WordPress Playground instance.
  playground-details:
    name: Comment on a pull request with Playground details
    runs-on: ubuntu-latest
    # Only run if the build workflow succeeded and was triggered by a pull_request
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    outputs:
      artifact-url: ${{ steps.expose.outputs.artifact-url }}
      artifact-name: ${{ steps.expose.outputs.artifact-name }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Resolve trusted PR metadata
        id: pr-metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The build runs untrusted PR code; the run's head SHA is the
            // only trusted value.
            const trustedSha = context.payload.workflow_run.head_sha;

            // Resolve the PR from the trusted head SHA, not the PR number in
            // the artifact name.
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const pr = pulls.find(p => p.head.sha === trustedSha);
            if (!pr) {
              throw new Error(`Could not resolve an open pull request for head SHA ${trustedSha}`);
            }

            // Match the artifact by the name the trusted build derives, not by
            // prefix.
            const expectedName = `classifai-zip-pr${pr.number}-${trustedSha}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const artifact = artifacts.find(a => a.name === expectedName);
            if (!artifact) {
              throw new Error(`Could not find plugin artifact named ${expectedName}`);
            }

            core.setOutput('pr-number', String(pr.number));
            core.setOutput('commit-sha', trustedSha);
            core.setOutput('artifact-name', artifact.name);

      - name: Expose built artifact
        id: expose
        uses: WordPress/action-wp-playground-pr-preview/.github/actions/expose-artifact-on-public-url@43fc435558bc6cee69f5b214d6b8ca4f9f80c31d # v3
        with:
          artifact-name: ${{ steps.pr-metadata.outputs.artifact-name }}
          artifact-filename: classifai.zip
          pr-number: ${{ steps.pr-metadata.outputs.pr-number }}
          commit-sha: ${{ steps.pr-metadata.outputs.commit-sha }}
          artifact-source-run-id: ${{ github.event.workflow_run.id }}
          artifacts-to-keep: '2'

      - name: Generate Playground blueprint JSON
        id: blueprint
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const url = process.env.ARTIFACT_URL;
          if (!url) {
            throw new Error('ARTIFACT_URL is required');
          }

          const blueprint = {
            preferredVersions: {
              wp: 'latest',
            },
            steps: [
              {
                step: 'installPlugin',
                pluginData: {
                  resource: 'url',
                  url,
                },
              },
            ],
          };

          console.log(`blueprint=${JSON.stringify(blueprint)}`);
          NODE
        env:
          ARTIFACT_URL: ${{ steps.expose.outputs.artifact-url }}

      - name: Post Playground preview button
        uses: WordPress/action-wp-playground-pr-preview@43fc435558bc6cee69f5b214d6b8ca4f9f80c31d # v3
        with:
          mode: append-to-description
          blueprint: ${{ steps.blueprint.outputs.blueprint }}
          pr-number: ${{ steps.pr-metadata.outputs.pr-number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
