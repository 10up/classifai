name: 'Spell Checker'
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  Spell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v4

      - name: Spell Check
        uses: crate-ci/typos@master
        with:
          files: ./
